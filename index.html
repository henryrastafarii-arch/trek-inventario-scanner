<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <meta
    name="theme-color"
    content="#0d47a1">

  <meta
    name="apple-mobile-web-app-capable"
    content="yes">

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent">

  <meta
    name="apple-mobile-web-app-title"
    content="Trek Inventario">

  <title>🚲 Trek Inventario</title>


  <!-- =====================================================
       LIBRERÍA DEL ESCÁNER
       ===================================================== -->

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #f4f6f8;
      color: #202124;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }


    body {
      padding-bottom: 35px;
    }


    /* =====================================================
       HEADER
       ===================================================== */

    .header {
      background:
        linear-gradient(
          135deg,
          #174f8a 0%,
          #0d47a1 100%
        );

      color: white;

      padding: 18px 16px;

      box-shadow:
        0 3px 12px
        rgba(0, 0, 0, .18);

      position: sticky;
      top: 0;
      z-index: 100;
    }


    .header-content {
      max-width: 650px;
      margin: auto;
    }


    .header h1 {
      margin: 0;

      font-size: 22px;

      font-weight: 700;
    }


    .header p {
      margin:
        5px
        0
        0;

      font-size: 12px;

      opacity: .9;
    }


    /* =====================================================
       CONTENEDOR
       ===================================================== */

    .container {
      width: 100%;
      max-width: 650px;

      margin:
        0
        auto;

      padding:
        12px;
    }


    /* =====================================================
       TARJETAS
       ===================================================== */

    .card {
      background: white;

      border-radius: 15px;

      padding: 15px;

      margin-bottom: 12px;

      box-shadow:
        0 2px 10px
        rgba(0, 0, 0, .08);
    }


    .card h2 {
      margin:
        0
        0
        12px;

      color: #174f8a;

      font-size: 17px;

      font-weight: 700;
    }


    /* =====================================================
       TIPO DE MOVIMIENTO
       ===================================================== */

    .mode {
      display: flex;

      gap: 8px;
    }


    .mode button {

      flex: 1;

      border: none;

      border-radius: 10px;

      padding:
        14px
        8px;

      color: white;

      font-size: 15px;

      font-weight: 700;

      cursor: pointer;

      transition:
        .15s ease;

    }


    .mode button:active {
      transform:
        scale(.98);
    }


    .btn-ingreso {
      background: #2e7d32;
    }


    .btn-egreso {
      background: #c62828;
    }


    .mode button.active {

      box-shadow:
        inset 0 0 0 3px
        rgba(255,255,255,.85),

        0 3px 9px
        rgba(0,0,0,.18);

    }


    /* =====================================================
       FORMULARIOS
       ===================================================== */

    label {

      display: block;

      margin:
        12px
        0
        5px;

      font-size: 13px;

      font-weight: 700;

      color: #3c4043;

    }


    select,
    input {

      width: 100%;

      min-height: 46px;

      padding:
        11px
        12px;

      border:
        1px solid #d5d9de;

      border-radius: 9px;

      background: white;

      color: #202124;

      font-size: 16px;

      outline: none;

    }


    select:focus,
    input:focus {

      border-color:
        #1a73e8;

      box-shadow:
        0 0 0 2px
        rgba(26,115,232,.12);

    }


    /* =====================================================
       CANTIDAD
       ===================================================== */

    .quantity {

      display: flex;

      gap: 10px;

      align-items: center;

    }


    .quantity button {

      flex:
        0 0 46px;

      width: 46px;

      height: 46px;

      border: none;

      border-radius: 50%;

      background: #1a73e8;

      color: white;

      font-size: 25px;

      line-height: 1;

      cursor: pointer;

    }


    .quantity input {

      text-align: center;

      font-weight: 700;

    }


    /* =====================================================
       BOTONES
       ===================================================== */

    .btn {

      width: 100%;

      min-height: 48px;

      border: none;

      border-radius: 10px;

      padding:
        13px;

      margin-top: 10px;

      color: white;

      font-size: 15px;

      font-weight: 700;

      cursor: pointer;

    }


    .btn:active {
      transform:
        scale(.985);
    }


    .btn-blue {
      background: #1a73e8;
    }


    .btn-gray {
      background: #5f6368;
    }


    .btn-dark {
      background: #263238;
    }


    /* =====================================================
       SCANNER
       ===================================================== */

    .scanner-container {

      display: none;

      margin-top: 12px;

      overflow: hidden;

      border-radius: 13px;

      background: #111;

      border:
        1px solid #222;

    }


    #reader {

      width: 100%;

      min-height: 280px;

    }


    #reader video {

      width:
        100% !important;

      height:
        auto !important;

      border-radius:
        12px;

    }


    #reader__dashboard_section_csr {

      padding-bottom:
        10px !important;

    }


    /* =====================================================
       PRODUCTO
       ===================================================== */

    .product {

      display: none;

      margin-top: 12px;

      padding: 14px;

      border-radius: 11px;

      background: #e3f2fd;

      border:
        1px solid #90caf9;

      font-size: 14px;

      line-height: 1.6;

    }


    .product-title {

      font-size: 17px;

      font-weight: 700;

      color: #0d47a1;

      margin-bottom: 5px;

    }


    .product strong {

      color: #174f8a;

    }


    /* =====================================================
       ESTADOS
       ===================================================== */

    .status {

      display: none;

      margin-top: 12px;

      padding: 13px;

      border-radius: 10px;

      font-size: 14px;

      line-height: 1.5;

      font-weight: 500;

    }


    .status.ok {

      display: block;

      background: #e8f5e9;

      color: #1b5e20;

      border:
        1px solid #a5d6a7;

    }


    .status.error {

      display: block;

      background: #ffebee;

      color: #b71c1c;

      border:
        1px solid #ef9a9a;

    }


    .status.info {

      display: block;

      background: #e3f2fd;

      color: #0d47a1;

      border:
        1px solid #90caf9;

    }


    /* =====================================================
       CARGANDO
       ===================================================== */

    .loading {

      display: none;

      text-align: center;

      padding: 15px;

      color: #5f6368;

      font-size: 14px;

    }


    .spinner {

      display: inline-block;

      width: 20px;

      height: 20px;

      border:
        3px solid #ddd;

      border-top-color:
        #1a73e8;

      border-radius: 50%;

      animation:
        spin .8s linear infinite;

      vertical-align: middle;

      margin-right: 7px;

    }


    @keyframes spin {

      to {
        transform:
          rotate(360deg);
      }

    }


    /* =====================================================
       MOVIMIENTOS
       ===================================================== */

    .recent {

      font-size: 13px;

    }


    .recent-item {

      padding:
        10px
        0;

      border-bottom:
        1px solid #eeeeee;

      line-height: 1.5;

    }


    .recent-item:last-child {

      border-bottom:
        none;

    }


    .recent-ingreso {

      color: #2e7d32;

      font-weight: 700;

    }


    .recent-egreso {

      color: #c62828;

      font-weight: 700;

    }


    .small {

      color: #777;

      font-size: 12px;

    }


    /* =====================================================
       TOAST NATIVO DE LA APP
       ===================================================== */

    .toast {

      position: fixed;

      left: 50%;

      bottom: 20px;

      width:
        calc(100% - 24px);

      max-width: 450px;

      padding: 14px 16px;

      background: #202124;

      color: white;

      border-radius: 12px;

      box-shadow:
        0 8px 30px
        rgba(0,0,0,.30);

      z-index: 99999;

      opacity: 0;

      pointer-events: none;

      transform:
        translate(-50%, 120px);

      transition:
        .25s ease;

      font-size: 14px;

      text-align: center;

    }


    .toast.show {

      opacity: 1;

      transform:
        translate(-50%, 0);

    }


    /* =====================================================
       MODAL
       ===================================================== */

    .modal-backdrop {

      display: none;

      position: fixed;

      inset: 0;

      background:
        rgba(0,0,0,.55);

      z-index: 99998;

      align-items: center;

      justify-content: center;

      padding: 20px;

    }


    .modal {

      width: 100%;

      max-width: 400px;

      background: white;

      border-radius: 16px;

      padding: 20px;

      box-shadow:
        0 12px 45px
        rgba(0,0,0,.3);

      text-align: center;

    }


    .modal-icon {

      font-size: 42px;

      margin-bottom: 8px;

    }


    .modal h3 {

      margin:
        0
        0
        8px;

      color: #174f8a;

    }


    .modal p {

      margin:
        0
        0
        15px;

      color: #5f6368;

      font-size: 14px;

      line-height: 1.5;

    }


    /* =====================================================
       DESKTOP
       ===================================================== */

    @media (min-width: 700px) {

      .container {

        padding-top: 20px;

      }

      .card {

        padding: 18px;

      }

    }

  </style>

</head>


<body>


<!-- =======================================================
     HEADER
     ======================================================= -->

<header class="header">

  <div class="header-content">

    <h1>
      🚲 Trek Inventario
    </h1>

    <p>
      Control de inventario · Scanner
    </p>

  </div>

</header>


<main class="container">


  <!-- =====================================================
       MOVIMIENTO
       ===================================================== -->

  <section class="card">

    <h2>
      📦 Tipo de movimiento
    </h2>


    <div class="mode">

      <button
        id="btnIngreso"
        class="btn-ingreso active"
        onclick="seleccionarAccion('INGRESO')">

        📥 Ingreso

      </button>


      <button
        id="btnEgreso"
        class="btn-egreso"
        onclick="seleccionarAccion('EGRESO')">

        📤 Egreso

      </button>

    </div>


    <label for="tienda">
      Tienda
    </label>


    <select id="tienda">

      <option value="XELA">
        Xela
      </option>

      <option value="HUEHUE">
        Huehuetenango
      </option>

    </select>


    <label for="cantidad">
      Cantidad
    </label>


    <div class="quantity">

      <button
        type="button"
        onclick="cambiarCantidad(-1)">

        −

      </button>


      <input
        id="cantidad"
        type="number"
        min="1"
        step="1"
        value="1">


      <button
        type="button"
        onclick="cambiarCantidad(1)">

        +

      </button>

    </div>


    <label for="observaciones">
      Observaciones
    </label>


    <input
      id="observaciones"
      type="text"
      placeholder="Opcional">

  </section>


  <!-- =====================================================
       SCANNER
       ===================================================== -->

  <section class="card">

    <h2>
      📷 Escanear producto
    </h2>


    <button
      id="btnStart"
      class="btn btn-blue"
      onclick="iniciarScanner()">

      📷 Activar cámara

    </button>


    <button
      id="btnStop"
      class="btn btn-gray"
      style="display:none;"
      onclick="detenerScanner()">

      ■ Detener cámara

    </button>


    <div
      id="scannerContainer"
      class="scanner-container">

      <div id="reader"></div>

    </div>


    <div
      id="loading"
      class="loading">

      <span class="spinner"></span>

      Procesando...

    </div>


    <div
      id="product"
      class="product">
    </div>


    <div
      id="status"
      class="status">
    </div>

  </section>


  <!-- =====================================================
       INGRESO MANUAL
       ===================================================== -->

  <section class="card">

    <h2>
      ⌨️ Código manual
    </h2>


    <input
      id="manual"
      type="text"
      autocomplete="off"
      placeholder="SKU o código de barras">


    <button
      class="btn btn-blue"
      onclick="procesarManual()">

      Buscar / registrar

    </button>

  </section>


  <!-- =====================================================
       MOVIMIENTOS
       ===================================================== -->

  <section class="card">

    <h2>
      📋 Movimientos recientes
    </h2>


    <div
      id="recent"
      class="recent">

      Cargando...

    </div>

  </section>


</main>


<!-- =======================================================
     TOAST
     ======================================================= -->

<div
  id="toast"
  class="toast">
</div>


<!-- =======================================================
     MODAL
     ======================================================= -->

<div
  id="modalBackdrop"
  class="modal-backdrop">

  <div class="modal">

    <div
      id="modalIcon"
      class="modal-icon">

      📷

    </div>


    <h3
      id="modalTitle">

      Cámara

    </h3>


    <p
      id="modalMessage">

      Permite el acceso a la cámara para escanear productos.

    </p>


    <button
      class="btn btn-blue"
      onclick="cerrarModal()">

      Entendido

    </button>

  </div>

</div>


<script>


/* ==========================================================
   CONFIGURACIÓN
   ========================================================== */


/*
 * =========================================================
 * URL DE TU API
 * =========================================================
 *
 * ESTA ES LA URL QUE PROPORCIONASTE.
 */

const API_URL =
  'https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnTCfcHQPeRrMDOQ5PhoM3-elrSlaqRLyMg6DPBUtLL9BqXwaJe738dFYc4fEnc9c8eUeXgGDcpFTu5gI7sMWNwcW5EeAhj2eGOxRFUCcQ8AQOE463gEkE7Mi9svV3VRY4UPNL0SZe9_FRZUKF7DX9pVz0S3dj3lY99TiDeNmfDojNKp8rO1OnsbD0Qkku7CIZJ4CEWWVR8DmWnf0RdcZ3qbloGx2FkRfZwplSvUfdLS6g_DtD3GCM4L9wuiT2AVU1_M-0dmhF456JPPRdmaMPCvI-Z5lRXRm5_Zs0OeRyoESJ8r1qc&lib=MKtIo6koLATszsDyuhHa3tzsOtP69R7J4';


/*
 * =========================================================
 * PIN DE LA API
 * =========================================================
 *
 * IMPORTANTE:
 *
 * Debe ser exactamente el mismo PIN que pusiste
 * en el proyecto "Trek Inventario API".
 *
 * EJEMPLO:
 *
 * const API_PIN = '151298';
 *
 * Cambia SOLO el valor entre comillas.
 */

const API_PIN =
  'PEGA_AQUI_EL_MISMO_PIN_DE_TU_API';


/* ==========================================================
   VARIABLES GLOBALES
   ========================================================== */

let accion =
  'INGRESO';


let scanner =
  null;


let scannerActivo =
  false;


let procesando =
  false;


let toastTimer =
  null;


/* ==========================================================
   INICIO
   ========================================================== */

document.addEventListener(
  'DOMContentLoaded',
  function() {

    seleccionarAccion(
      'INGRESO'
    );


    cargarRecientes();

  }
);


/* ==========================================================
   SELECCIONAR INGRESO / EGRESO
   ========================================================== */

function seleccionarAccion(
  tipo
) {

  accion =
    tipo;


  const ingreso =
    document.getElementById(
      'btnIngreso'
    );


  const egreso =
    document.getElementById(
      'btnEgreso'
    );


  ingreso.classList.toggle(
    'active',
    tipo === 'INGRESO'
  );


  egreso.classList.toggle(
    'active',
    tipo === 'EGRESO'
  );


  if (
    tipo === 'INGRESO'
  ) {

    mostrarToast(
      'Modo ingreso seleccionado.'
    );

  }

  else {

    mostrarToast(
      'Modo egreso seleccionado.'
    );

  }

}


/* ==========================================================
   CANTIDAD
   ========================================================== */

function cambiarCantidad(
  delta
) {

  const input =
    document.getElementById(
      'cantidad'
    );


  let cantidad =
    parseInt(
      input.value,
      10
    );


  if (
    isNaN(cantidad)
  ) {

    cantidad =
      1;

  }


  cantidad +=
    delta;


  if (
    cantidad < 1
  ) {

    cantidad =
      1;

  }


  input.value =
    cantidad;

}


/* ==========================================================
   TOAST
   ========================================================== */

function mostrarToast(
  mensaje
) {

  const toast =
    document.getElementById(
      'toast'
    );


  toast.textContent =
    mensaje;


  toast.classList.add(
    'show'
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      function() {

        toast.classList.remove(
          'show'
        );

      },
      3000
    );

}


/* ==========================================================
   MODAL
   ========================================================== */

function mostrarModal(
  icono,
  titulo,
  mensaje
) {

  document
    .getElementById(
      'modalIcon'
    )
    .textContent =
    icono;


  document
    .getElementById(
      'modalTitle'
    )
    .textContent =
    titulo;


  document
    .getElementById(
      'modalMessage'
    )
    .textContent =
    mensaje;


  document
    .getElementById(
      'modalBackdrop'
    )
    .style.display =
    'flex';

}


function cerrarModal() {

  document
    .getElementById(
      'modalBackdrop'
    )
    .style.display =
    'none';

}


/* ==========================================================
   ESTADO
   ========================================================== */

function mostrarEstado(
  mensaje,
  tipo
) {

  const el =
    document.getElementById(
      'status'
    );


  el.textContent =
    mensaje;


  el.className =
    'status ' +
    tipo;


  el.style.display =
    'block';

}


function ocultarEstado() {

  const el =
    document.getElementById(
      'status'
    );


  el.style.display =
    'none';

}


/* ==========================================================
   INICIAR SCANNER
   ========================================================== */

async function iniciarScanner() {

  if (
    scannerActivo ||
    procesando
  ) {

    return;

  }


  ocultarEstado();


  document
    .getElementById(
      'scannerContainer'
    )
    .style.display =
    'block';


  document
    .getElementById(
      'btnStart'
    )
    .style.display =
    'none';


  document
    .getElementById(
      'btnStop'
    )
    .style.display =
    'block';


  try {

    /*
     * Crear lector.
     */

    scanner =
      new Html5Qrcode(
        'reader'
      );


    /*
     * Formatos que aceptaremos.
     */

    const formatos = [

      Html5QrcodeSupportedFormats.QR_CODE,

      Html5QrcodeSupportedFormats.EAN_13,

      Html5QrcodeSupportedFormats.EAN_8,

      Html5QrcodeSupportedFormats.UPC_A,

      Html5QrcodeSupportedFormats.UPC_E,

      Html5QrcodeSupportedFormats.CODE_128,

      Html5QrcodeSupportedFormats.CODE_39,

      Html5QrcodeSupportedFormats.CODE_93,

      Html5QrcodeSupportedFormats.ITF,

      Html5QrcodeSupportedFormats.DATA_MATRIX

    ];


    /*
     * Intentamos primero la cámara trasera.
     */

    await scanner.start(

      {
        facingMode:
          'environment'
      },

      {

        fps:
          10,

        qrbox:
          {
            width:
              280,

            height:
              180
          },

        formatsToSupport:
          formatos

      },

      function(decodedText) {

        /*
         * Evitar múltiples lecturas.
         */

        if (
          procesando
        ) {

          return;

        }


        procesando =
          true;


        mostrarToast(
          'Código detectado.'
        );


        detenerScanner()
          .finally(
            function() {

              procesarCodigo(
                decodedText
              );

            }
          );

      },

      function(errorMessage) {

        /*
         * Los errores de cada frame
         * se ignoran.
         */

      }

    );


    scannerActivo =
      true;


    mostrarToast(
      'Cámara activada.'
    );


  }

  catch(error) {

    console.error(
      'Error cámara:',
      error
    );


    detenerScannerVisual();


    let mensaje =
      'No fue posible activar la cámara.';


    const texto =
      String(
        error
      );


    if (
      texto.includes(
        'NotAllowedError'
      ) ||
      texto.includes(
        'Permission'
      )
    ) {

      mensaje =
        'El navegador bloqueó la cámara. Asegúrate de abrir esta página desde HTTPS y permite el acceso a la cámara.';

      mostrarModal(
        '🔒',
        'Cámara bloqueada',
        mensaje
      );

    }

    else if (
      texto.includes(
        'NotFoundError'
      )
    ) {

      mensaje =
        'No se encontró una cámara disponible.';

      mostrarModal(
        '📷',
        'Cámara no encontrada',
        mensaje
      );

    }

    else if (
      texto.includes(
        'NotReadableError'
      )
    ) {

      mensaje =
        'La cámara está siendo utilizada por otra aplicación.';

      mostrarModal(
        '⚠️',
        'Cámara ocupada',
        mensaje
      );

    }

    else {

      mostrarModal(
        '⚠️',
        'No se pudo activar la cámara',
        mensaje
      );

    }


    mostrarEstado(
      mensaje,
      'error'
    );

  }

}


/* ==========================================================
   DETENER SCANNER
   ========================================================== */

async function detenerScanner() {

  if (
    scanner
  ) {

    try {

      if (
        scannerActivo
      ) {

        await scanner.stop();

      }

    }

    catch(error) {

      console.warn(
        'Error deteniendo scanner:',
        error
      );

    }


    try {

      scanner.clear();

    }

    catch(error) {

      console.warn(
        'Error limpiando scanner:',
        error
      );

    }

  }


  scanner =
    null;


  scannerActivo =
    false;


  detenerScannerVisual();

}


function detenerScannerVisual() {

  document
    .getElementById(
      'scannerContainer'
    )
    .style.display =
    'none';


  document
    .getElementById(
      'btnStart'
    )
    .style.display =
    'block';


  document
    .getElementById(
      'btnStop'
    )
    .style.display =
    'none';

}


/* ==========================================================
   CÓDIGO MANUAL
   ========================================================== */

function procesarManual() {

  const input =
    document.getElementById(
      'manual'
    );


  const codigo =
    input.value.trim();


  if (
    !codigo
  ) {

    mostrarEstado(
      'Escribe un SKU o código de barras.',
      'error'
    );

    return;

  }


  procesarCodigo(
    codigo
  );

}


/* ==========================================================
   PROCESAR CÓDIGO
   ========================================================== */

function procesarCodigo(
  codigo
) {

  codigo =
    String(
      codigo || ''
    ).trim();


  if (
    !codigo
  ) {

    procesando =
      false;

    return;

  }


  const tienda =
    document
      .getElementById(
        'tienda'
      )
      .value;


  const cantidad =
    Number(
      document
        .getElementById(
          'cantidad'
        )
        .value
    );


  const observaciones =
    document
      .getElementById(
        'observaciones'
      )
      .value
      .trim();


  if (
    !cantidad ||
    cantidad <= 0
  ) {

    mostrarEstado(
      'La cantidad debe ser mayor que cero.',
      'error'
    );


    procesando =
      false;


    return;

  }


  /*
   * Mostrar cargando.
   */

  document
    .getElementById(
      'loading'
    )
    .style.display =
    'block';


  ocultarEstado();


  document
    .getElementById(
      'product'
    )
    .style.display =
    'none';


  /*
   * Llamar API.
   */

  llamarAPI(

    'movimiento',

    {

      codigo:
        codigo,

      accion:
        accion,

      cantidad:
        cantidad,

      tienda:
        tienda,

      observaciones:
        observaciones

    },

    function(res) {

      document
        .getElementById(
          'loading'
        )
        .style.display =
        'none';


      procesando =
        false;


      /*
       * Error.
       */

      if (
        !res ||
        !res.ok
      ) {

        let mensaje =
          'No se pudo registrar el movimiento.';


        if (
          res &&
          res.mensaje
        ) {

          mensaje =
            res.mensaje;

        }

        else if (
          res &&
          res.error
        ) {

          mensaje =
            res.error;

        }


        mostrarEstado(
          mensaje,
          'error'
        );


        mostrarToast(
          'Movimiento no registrado.'
        );


        return;

      }


      /*
       * Mostrar producto.
       */

      mostrarProducto(
        res
      );


      /*
       * Confirmación.
       */

      mostrarEstado(
        '✓ ' +
        res.mensaje,
        'ok'
      );


      mostrarToast(
        'Movimiento registrado correctamente.'
      );


      /*
       * Limpiar campos.
       */

      document
        .getElementById(
          'manual'
        )
        .value =
        '';


      document
        .getElementById(
          'observaciones'
        )
        .value =
        '';


      /*
       * Actualizar movimientos.
       */

      cargarRecientes();

    }

  );

}


/* ==========================================================
   MOSTRAR PRODUCTO
   ========================================================== */

function mostrarProducto(
  res
) {

  const producto =
    document.getElementById(
      'product'
    );


  producto.innerHTML =

    '<div class="product-title">' +

      '🚲 ' +

      escapar(
        res.producto
      ) +

    '</div>' +

    '<strong>SKU:</strong> ' +

      escapar(
        res.sku
      ) +

    '<br>' +

    '<strong>Tienda:</strong> ' +

      escapar(
        res.tienda
      ) +

    '<br>' +

    '<strong>Cantidad:</strong> ' +

      escapar(
        res.cantidad
      ) +

    '<br>' +

    '<strong>Stock en tienda:</strong> ' +

      escapar(
        res.stockTienda
      ) +

    '<br>' +

    '<strong>Stock total:</strong> ' +

      escapar(
        res.stockTotal
      );


  producto.style.display =
    'block';

}


/* ==========================================================
   LLAMADA A API
   ========================================================== */

function llamarAPI(
  action,
  params,
  callback
) {

  /*
   * Validar URL.
   */

  if (
    !API_URL ||
    API_URL.indexOf(
      'PEGA_AQUI'
    ) !== -1
  ) {

    callback({

      ok:
        false,

      error:
        'La URL de la API no está configurada.'

    });

    return;

  }


  /*
   * Validar PIN.
   */

  if (
    !API_PIN ||
    API_PIN.indexOf(
      'PEGA_AQUI'
    ) !== -1
  ) {

    callback({

      ok:
        false,

      error:
        'Debes colocar el PIN de Trek Inventario API en index.html.'

    });

    return;

  }


  /*
   * Nombre único para JSONP.
   */

  const callbackName =

    '__trekInventario_' +

    Date.now() +

    '_' +

    Math.floor(
      Math.random() * 100000
    );


  /*
   * Crear callback.
   */

  window[
    callbackName
  ] = function(data) {

    try {

      callback(
        data
      );

    }

    finally {

      delete window[
        callbackName
      ];

    }

  };


  /*
   * Construir parámetros.
   */

  const query =
    new URLSearchParams();


  query.set(
    'action',
    action
  );


  query.set(
    'pin',
    API_PIN
  );


  query.set(
    'callback',
    callbackName
  );


  Object.keys(
    params || {}
  ).forEach(
    function(key) {

      query.set(
        key,
        params[key]
      );

    }
  );


  /*
   * Crear script JSONP.
   */

  const script =
    document.createElement(
      'script'
    );


  script.src =
    API_URL +
    (
      API_URL.includes('?')
        ? '&'
        : '?'
    ) +
    query.toString();


  /*
   * Error de conexión.
   */

  script.onerror =
    function() {

      delete window[
        callbackName
      ];


      callback({

        ok:
          false,

        error:
          'No se pudo conectar con Trek Inventario API.'

      });

    };


  /*
   * Agregar a la página.
   */

  document
    .body
    .appendChild(
      script
    );


  /*
   * Limpiar después de 15 segundos.
   */

  setTimeout(
    function() {

      try {

        script.remove();

      }

      catch(error) {}

    },
    15000
  );

}


/* ==========================================================
   MOVIMIENTOS RECIENTES
   ========================================================== */

function cargarRecientes() {

  llamarAPI(

    'recientes',

    {},

    function(res) {

      const contenedor =
        document.getElementById(
          'recent'
        );


      if (
        !res ||
        !res.ok
      ) {

        contenedor.innerHTML =

          '<span class="small">' +

          'No se pudieron cargar los movimientos.' +

          '</span>';

        return;

      }


      const movimientos =
        res.movimientos || [];


      if (
        movimientos.length === 0
      ) {

        contenedor.innerHTML =

          '<span class="small">' +

          'No hay movimientos registrados.' +

          '</span>';

        return;

      }


      let html =
        '';


      movimientos.forEach(
        function(m) {

          const esIngreso =
            m.tipo ===
            'INGRESO';


          const icono =
            esIngreso
              ? '📥'
              : '📤';


          const clase =
            esIngreso
              ? 'recent-ingreso'
              : 'recent-egreso';


          html +=

            '<div class="recent-item">' +

              '<span class="' +
              clase +
              '">' +

                icono +
                ' ' +

                escapar(
                  m.tipo
                ) +

              '</span>' +

              '<br>' +

              '<strong>' +

                escapar(
                  m.descripcion
                ) +

              '</strong>' +

              '<br>' +

              '<span class="small">' +

                'SKU: ' +

                escapar(
                  m.sku
                ) +

                ' · Cantidad: ' +

                escapar(
                  m.cantidad
                ) +

                ' · ' +

                escapar(
                  m.tienda
                ) +

              '</span>' +

            '</div>';

        }
      );


      contenedor.innerHTML =
        html;

    }

  );

}


/* ==========================================================
   ESCAPAR HTML
   ========================================================== */

function escapar(
  valor
) {

  if (
    valor === null ||
    valor === undefined
  ) {

    return '';

  }


  return String(
    valor
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}
